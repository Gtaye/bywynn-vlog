<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="{{colorScheme}}">
  <meta name="description" content="{{description}}">
  <title>{{name}}</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <a class="skip" href="#feed">Skip to events</a>

  <header class="masthead">
    <div class="wrap masthead__inner">
      <a class="wordmark" href="#" data-home>{{name}}</a>
      <p class="tagline">{{tagline}}</p>
    </div>
  </header>

  <main class="wrap">
    <section id="feed" class="feed" aria-label="Event recaps"></section>
    <section id="recap" class="recap" hidden aria-live="polite"></section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p>{{footer}}</p>
    </div>
  </footer>

  <script type="application/json" id="events">/*__EVENTS__*/[]</script>
  <script src="app.js" defer></script>
</body>
</html>
